[package]
name = "lightpool-strategies"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Trading strategies for LightPool simulation"
publish = false

[lints]
workspace = true

[lib]
name = "lightpool_strategies"
crate-type = ["rlib"]

[dependencies]
nautilus-trading = { workspace = true }
nautilus-common = { workspace = true, features = ["live"] }
nautilus-model = { workspace = true, features = ["stubs"] }
nautilus-core = { workspace = true }
nautilus-live = { workspace = true, features = ["node"] }
nautilus-polymarket = { workspace = true, default-features = true }

ahash = { workspace = true }
anyhow = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
dotenvy = "0.15"
log = { workspace = true }
tokio = { workspace = true }

[[bin]]
name = "liquidity-maker"
path = "src/bin/liquidity_maker.rs"
