[package]
name = "nautilus-lightpool"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "LightPool integration adapter for the Nautilus trading engine"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "nautilus_lightpool"
crate-type = ["rlib"]

[features]
default = ["high-precision"]
examples = ["nautilus-live/node"]
high-precision = ["nautilus-model/high-precision"]

[dependencies]
nautilus-common = { workspace = true, features = ["live"] }
nautilus-core = { workspace = true }
nautilus-live = { workspace = true }
nautilus-model = { workspace = true }

lightpool-sdk = { path = "../../../../lightpool/crates/lightpool-sdk" }

ahash = { workspace = true }
bincode = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
dashmap = { workspace = true }
futures-util = { workspace = true }
hex = "0.4.3"
log = { workspace = true }
reqwest = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
ustr = { workspace = true }
uuid = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
dotenvy = "0.15"

[dev-dependencies]
nautilus-testkit = { workspace = true }
nautilus-trading = { workspace = true }

[[bin]]
name = "lightpool-http-public"
path = "bin/http_public.rs"
doc = false
test = false

[[bin]]
name = "lightpool-http-private"
path = "bin/http_private.rs"
doc = false
test = false

[[bin]]
name = "lightpool-ws-data"
path = "bin/ws_data.rs"
doc = false
test = false

[[bin]]
name = "lightpool-ws-user"
path = "bin/ws_user.rs"
doc = false
test = false

[[bin]]
name = "lightpool-http-exec"
path = "bin/http_exec.rs"
doc = false
test = false

[[bin]]
name = "lightpool-http-outcome-order"
path = "bin/http_outcome_order.rs"
doc = false
test = false

[[bin]]
name = "lightpool-http-user-outcome"
path = "bin/http_user_outcome.rs"
doc = false
test = false

[[bin]]
name = "lightpool-http-bootstrap"
path = "bin/http_bootstrap.rs"
doc = false
test = false

[[bin]]
name = "lightpool-http-seed-book"
path = "bin/http_seed_book.rs"
doc = false
test = false

[[example]]
name = "lightpool-data-tester"
path = "examples/node_data_tester.rs"
required-features = ["examples"]
doc = false

# Run with `cargo run -p nautilus-lightpool --example lightpool-exec-tester --features examples`.
[[example]]
name = "lightpool-exec-tester"
path = "examples/node_exec_tester.rs"
required-features = ["examples"]
doc = false
